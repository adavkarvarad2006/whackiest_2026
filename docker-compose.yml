services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arthalens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arthalens
      POSTGRES_PASSWORD: arthalens_dev_password
      POSTGRES_DB: arthalens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthalens -d arthalens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arthalens-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://arthalens:arthalens_dev_password@postgres:5432/arthalens
      UPLOAD_STORAGE_DIR: /app/storage/uploads
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/storage/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arthalens-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads_data:
